<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="14" fill="url(#gradient1)" stroke="white" stroke-width="1.5"/>
  
  <!-- Book/Learning symbol -->
  <rect x="8" y="11" width="12" height="10" rx="1" fill="white" opacity="0.9"/>
  <line x1="8" y1="11" x2="8" y2="21" stroke="url(#gradient1)" stroke-width="1" />
  <line x1="10" y1="14" x2="16" y2="14" stroke="url(#gradient1)" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="16" x2="15" y2="16" stroke="url(#gradient1)" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Coin/Payment symbol -->
  <circle cx="21" cy="12" r="4.5" fill="url(#gradient2)" stroke="white" stroke-width="1"/>
  <text x="21" y="14.5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="6" font-weight="bold">$</text>
  
  <!-- Skill nodes -->
  <circle cx="11" cy="7" r="1.5" fill="url(#gradient2)" opacity="0.8"/>
  <circle cx="21" cy="6" r="1.5" fill="url(#gradient2)" opacity="0.8"/>
  <circle cx="26" cy="16" r="1.5" fill="url(#gradient2)" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="11" y1="7" x2="14" y2="10" stroke="url(#gradient2)" stroke-width="0.8" opacity="0.6"/>
  <line x1="21" y1="6" x2="19" y2="9" stroke="url(#gradient2)" stroke-width="0.8" opacity="0.6"/>
  <line x1="25" y1="15" x2="23" y2="13" stroke="url(#gradient2)" stroke-width="0.8" opacity="0.6"/>
</svg>